# Once a day, CompatHelper compares the [compat] bounds in Project.toml with what the
# registry now has and opens a pull request for each bound a new release has outgrown.
# Nothing merges by itself; the pull request runs the test suite like any other.
name: CompatHelper
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - run: julia -e 'using CompatHelper; CompatHelper.main()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
