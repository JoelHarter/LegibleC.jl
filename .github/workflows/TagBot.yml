# When a release is merged into the General registry, the JuliaTagBot app comments here
# and this workflow tags the registered commit (v0.1.0, ...) and opens a GitHub release
# for it, so that a tag always points at exactly what the registry serves. It needs the
# JuliaTagBot app installed on the repository; the workflow_dispatch form runs it by hand.
name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
